services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odds_engine_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_NAME: OddsEngine
      APP_ENV: local
      APP_DEBUG: "true"
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://odds_engine:odds_engine@db:5432/odds_engine
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: odds_engine_db
    environment:
      POSTGRES_DB: odds_engine
      POSTGRES_USER: odds_engine
      POSTGRES_PASSWORD: odds_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odds_engine -d odds_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: odds_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: